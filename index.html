<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My messy todo list</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="notebook">
      <header>
        <p class="date">Sat, Nov 21</p>
        <h1>Things to do</h1>
      </header>

      <form id="todo-form" autocomplete="off">
        <input id="todo-input" type="text" placeholder="write somthing..." />
        <button type="submit">add</button>
      </form>

      <ul id="todo-list"></ul>

      <button id="clear-button" type="button">clear checked</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
